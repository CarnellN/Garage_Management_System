# One-command deployment: MySQL + API + web client.
#   cp deploy/.env.example deploy/.env   # then fill in the secrets
#   docker compose --env-file deploy/.env up -d --build
#   docker compose --env-file deploy/.env run --rm api node scripts/create-admin.js   # first admin
# Web: http://localhost:8080   API docs: http://localhost:8000/api/docs
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: garage_management_db
      MYSQL_USER: garage_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in deploy/.env}
    command: ["--default-time-zone=+00:00"]
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    # No ports: the database is reachable only from the api container.

  api:
    build: { context: ., dockerfile: backend/server/Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: deploy/.env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: garage_user
      DB_NAME: garage_management_db
      DB_SSL: "false"
      DB_TRUSTED_PRIVATE_NETWORK: "true"
    ports: ["8000:8000"]
    networks: [backend, frontend]

  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    ports: ["8080:80"]
    networks: [frontend]

networks:
  backend: { internal: true }
  frontend: {}

volumes:
  mysql-data:
