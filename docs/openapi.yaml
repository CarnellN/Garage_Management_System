components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Short-lived signed access token from login or registration. Roles and object scopes are enforced by the server; x-roles is descriptive metadata."
  parameters:
    Page:
      name: "page"
      in: "query"
      required: false
      schema:
        type: "integer"
        format: "int32"
        minimum: 1
        default: 1
    PageSize:
      name: "page_size"
      in: "query"
      required: false
      schema:
        type: "integer"
        format: "int32"
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema:
        type: "string"
        maxLength: 128
        minLength: 16
      description: "Required retry key scoped to authenticated principal, HTTP method and canonical path. Retain at least 24 hours. Same key and body replay the original response; different body returns 409. Concurrent identical requests are serialized. Persist key and successful business mutation atomically; validation failures are not cached."
    IfMatch:
      name: "If-Match"
      in: "header"
      required: true
      schema:
        type: "string"
        example: "\"3\""
      description: "Strong ETag from the latest individual booking/job-card GET or mutation. Missing returns 428; stale returns 412. Job task/part mutations use the parent job-card ETag and increment its version."
  responses:
    BadRequest:
      description: "Malformed JSON, invalid parameter syntax, or missing Idempotency-Key."
      headers:
        X-Request-ID:
          description: "Correlation identifier; also returned in errors."
          schema:
            type: "string"
        Cache-Control:
          description: "Sensitive API responses must not be stored."
          schema:
            type: "string"
            enum:
              - "no-store"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Unauthorized:
      description: "Missing, invalid, expired or revoked bearer token; login uses a generic invalid-credentials message."
      headers:
        X-Request-ID:
          description: "Correlation identifier; also returned in errors."
          schema:
            type: "string"
        Cache-Control:
          description: "Sensitive API responses must not be stored."
          schema:
            type: "string"
            enum:
              - "no-store"
        WWW-Authenticate:
          schema:
            type: "string"
            example: "Bearer"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Forbidden:
      description: "Authenticated user lacks the required role or permitted action."
      headers:
        X-Request-ID:
          description: "Correlation identifier; also returned in errors."
          schema:
            type: "string"
        Cache-Control:
          description: "Sensitive API responses must not be stored."
          schema:
            type: "string"
            enum:
              - "no-store"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    NotFound:
      description: "Resource does not exist or is outside the caller ownership/assignment scope."
      headers:
        X-Request-ID:
          description: "Correlation identifier; also returned in errors."
          schema:
            type: "string"
        Cache-Control:
          description: "Sensitive API responses must not be stored."
          schema:
            type: "string"
            enum:
              - "no-store"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Conflict:
      description: "Business conflict: duplicate key, overlapping reservation, invalid state transition, already invoiced, overpayment, or mismatched idempotency payload."
      headers:
        X-Request-ID:
          description: "Correlation identifier; also returned in errors."
          schema:
            type: "string"
        Cache-Control:
          description: "Sensitive API responses must not be stored."
          schema:
            type: "string"
            enum:
              - "no-store"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    PreconditionFailed:
      description: "Stale If-Match; refetch the resource before retrying."
      headers:
        X-Request-ID:
          description: "Correlation identifier; also returned in errors."
          schema:
            type: "string"
        Cache-Control:
          description: "Sensitive API responses must not be stored."
          schema:
            type: "string"
            enum:
              - "no-store"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    UnprocessableEntity:
      description: "Well-formed input violates a field, relationship or business validation rule."
      headers:
        X-Request-ID:
          description: "Correlation identifier; also returned in errors."
          schema:
            type: "string"
        Cache-Control:
          description: "Sensitive API responses must not be stored."
          schema:
            type: "string"
            enum:
              - "no-store"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    PreconditionRequired:
      description: "Required If-Match header is missing."
      headers:
        X-Request-ID:
          description: "Correlation identifier; also returned in errors."
          schema:
            type: "string"
        Cache-Control:
          description: "Sensitive API responses must not be stored."
          schema:
            type: "string"
            enum:
              - "no-store"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    TooManyRequests:
      description: "Rate limit exceeded. Retry after the specified number of seconds."
      headers:
        X-Request-ID:
          description: "Correlation identifier; also returned in errors."
          schema:
            type: "string"
        Cache-Control:
          description: "Sensitive API responses must not be stored."
          schema:
            type: "string"
            enum:
              - "no-store"
        Retry-After:
          schema:
            type: "integer"
            format: "int32"
            minimum: 1
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    InternalError:
      description: "Unexpected failure; details are never exposed."
      headers:
        X-Request-ID:
          description: "Correlation identifier; also returned in errors."
          schema:
            type: "string"
        Cache-Control:
          description: "Sensitive API responses must not be stored."
          schema:
            type: "string"
            enum:
              - "no-store"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Unavailable:
      description: "Temporarily unavailable; retry only according to idempotency rules."
      headers:
        X-Request-ID:
          description: "Correlation identifier; also returned in errors."
          schema:
            type: "string"
        Cache-Control:
          description: "Sensitive API responses must not be stored."
          schema:
            type: "string"
            enum:
              - "no-store"
        Retry-After:
          schema:
            type: "integer"
            format: "int32"
            minimum: 1
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
