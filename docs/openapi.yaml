  "/invoices/{invoiceId}/payment-intents":
    post:
      tags:
        - "Payments"
      operationId: "createPaymentIntent"
      summary: "Start an online payment"
      description: "Customers may access only their linked profile and resources reached through that profile. Receptionist and admin may access all customer resources. Out-of-scope identifiers return 404. Creates a pending provider checkout, never a settled PAYMENT. Atomically reserve amount against invoice balance (including other pending reservations); reject overpayment with 409. Provider confirmation must be authenticated and verified server-to-server, deduplicated by provider transaction ID, and atomically insert exactly one PAYMENT and mark intent SUCCEEDED. FAILED/EXPIRED intents release reservations. Expiry/callback races must reconcile before release; never drop a verified charge. No public callback endpoint is specified; the provider adapter is deployment-specific."
      x-roles:
        - "CUSTOMER"
        - "RECEPTIONIST"
        - "ADMIN"
      responses:
        "201":
          description: "Created."
          headers:
            X-Request-ID:
              description: "Correlation identifier; also returned in errors."
              schema:
                type: "string"
            Cache-Control:
              description: "Sensitive API responses must not be stored."
              schema:
                type: "string"
                enum:
                  - "no-store"
            Location:
              description: "Relative or absolute URI of the created resource."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PaymentIntent"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/UnprocessableEntity"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
        "500":
          "$ref": "#/components/responses/InternalError"
        "503":
          "$ref": "#/components/responses/Unavailable"
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
        -
          name: "invoiceId"
