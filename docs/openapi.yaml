x-database-schema:
  source: backend/database/schema.sql
  engine: MySQL 8.0.16+ / InnoDB
  naming: Lowercase table/column identifiers; job_part is singular and invoice_line uses invoice_line_id.
  timestamps: DATETIME(0); sessions use UTC and booking writes require whole seconds.
  idempotency: idempotency_key uses http_method, request_fingerprint, response_status and response_body. response_body stores the API body and replay headers in an internal envelope.
  sessions: No auth_session table. The server stores expiring login grants in idempotency_key under http_method=SESSION and path=/api/v1/auth/sessions. Logout deletes the grant; account changes revoke all matching grants.
  payments: payment_intent status reads are supported. New online checkout requires a configured provider; pending intents reserve invoice balance until reconciled.
