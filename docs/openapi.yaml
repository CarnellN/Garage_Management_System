# Garage Management System API contract
# OpenAPI 3.0.3; database: garage_management_db
openapi: "3.0.3"
info:
  title: "Garage Management System API"
  version: "1.0.0"
  description: |-
    REST API contract for garage_management_db. Covers customer registration, vehicles, scheduling, assigned repair work, invoicing and payments.

    Authorization: all operations require a bearer session except registration and login. x-roles lists allowed application roles and is documentation, not an OpenAPI security scope; enforce role and object ownership checks server-side on every request. CUSTOMER ownership follows USER.customer_id -> CUSTOMER -> VEHICLE -> BOOKING/JOB_CARD -> INVOICE -> PAYMENT. MECHANIC access to jobs/tasks/job parts is limited to current assignments. ADMIN oversees all operations. Caller-supplied identifiers never override ownership. Return 404 for inaccessible objects. Lists must apply the same scope before pagination/counting; an explicit out-of-scope owner or parent filter returns 404. Use non-null API roles and statuses; migrate legacy nullable values before serving them.

    Input: reject unknown fields and blank names; PATCH applies only supplied fields, and explicit null is accepted only where nullable. Check foreign keys, enum values and string limits. IDs are positive INTs. Date-time input requires an explicit offset and is stored in UTC. All amounts are exact decimal strings in KES; calculate using decimal arithmetic. Client cannot set IDs, totals, payment timestamps or ownership links not exposed in write schemas. Lists use page/page_size (max 100), return items and pagination.total, and default to ascending primary key unless otherwise stated. Counts are scoped; pagination is not a multi-request snapshot.

    Scheduling: garage timezone Africa/Nairobi. Operator configures opening hours, enabled bays and labor hourly rate outside this API. A reservation occupies [scheduled_at, ends_at). PENDING, CONFIRMED and CHECKED_IN consume bay and vehicle capacity until end or terminal transition. Prevent interval overlap for each bay and each vehicle through database-enforced constraints or serializable transactions with locking and retry; application prechecks alone are insufficient. Availability is advisory. Use ETags/If-Match on booking/job writes; stale writes return 412 and missing preconditions 428. Parent job versions include task/part changes. Mutations revalidate role, assignment, state and balance in the same transaction. No double-booking, duplicate invoice, duplicate settled provider transaction, or overpayment under concurrent use.

    Security: TLS is mandatory outside local development. Store salted adaptive password hashes, never plaintext/reversible passwords. Use parameterized SQL, allowlisted sort/filter expressions, least-privilege database access, signed expiring tokens with issuer/audience verification, immediate session revocation, login rate limits and restricted CORS. Never expose password hashes in any response. Customer and staff email normalization must be consistent. Audit authorization, authentication and writes without secrets. Authentication responses and all sensitive responses use Cache-Control: no-store. Request correlation uses server-generated X-Request-ID.

    Reliability/usability targets: with a production-sized dataset at the agreed deployment load (baseline: 100 concurrent active users), p95 API response time is <= 1000 ms excluding external payment-provider time, and p95 primary page load is < 3 seconds on a documented representative mobile network. Verify with load tests and real browser measurements; the contract does not implement these guarantees. Use pagination, indexed foreign keys/date filters and bounded queries. Frontend acceptance requires responsive layouts at 360px and desktop widths, labeled accessible controls, clear field errors, loading indicators and confirmation of payments/bookings. Monitor error rate and latency; transactions must roll back fully on failure.

    Business scope: no tax, discounts, refunds, stock inventory or account recovery in v1. Record only parts consumed, not warehouse stock. No hard deletion of users, customers, bookings, job cards, invoices or payments. Profiles created by receptionists have no login until a separately verified linking process is implemented. API credential provisioning/bootstrap of the first admin is an out-of-band deployment operation. Payment providers and their authenticated callback/reconciliation adapters must be selected during implementation; a client request alone never proves payment.
  x-database-name: "garage_management_db"
servers:
  -
    url: "http://localhost:8000/api/v1"
    description: "Local development only; replace port to match backend."
  -
    url: "https://{host}/api/v1"
    description: "Production deployment placeholder."
    variables:
      host:
        default: "garage.example.com"
