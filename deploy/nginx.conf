server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer;
  # Single-page app: unknown paths load index.html so client-side routes work on refresh.
  location / { try_files $uri /index.html; }
  # Same-origin API access for the browser (avoids CORS in this deployment).
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location /health { proxy_pass http://api:8000; }
}
